<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>SellerShield - Payment Accounts</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f7fb;
            color: #1f2937;
        }

        .container {
            max-width: 850px;
            margin: 40px auto;
            padding: 0 20px;
        }

        .header {
            background: white;
            padding: 18px 22px;
            border-radius: 14px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.06);
            margin-bottom: 25px;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .brand-icon {
            width: 45px;
            height: 45px;
            background: #2563eb;
            color: white;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            font-weight: bold;
        }

        .brand h1 {
            margin: 0;
            font-size: 23px;
        }

        .brand p {
            margin: 4px 0 0;
            color: #6b7280;
            font-size: 13px;
        }

        .back-btn {
            padding: 9px 15px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            background: white;
            cursor: pointer;
            font-weight: bold;
        }

        .back-btn:hover {
            background: #f3f4f6;
        }

        .card {
            background: white;
            padding: 28px;
            border-radius: 16px;
            box-shadow: 0 4px 18px rgba(0,0,0,0.06);
            margin-bottom: 20px;
        }

        .card h2 {
            margin-top: 0;
        }

        .subtitle {
            color: #6b7280;
            font-size: 14px;
            margin-bottom: 25px;
        }

        .account {
            border: 1px solid #e5e7eb;
            border-radius: 12px;
            padding: 18px;
            margin-bottom: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .account-name {
            font-weight: bold;
            font-size: 16px;
            margin-bottom: 6px;
        }

        .upi {
            color: #6b7280;
            font-size: 14px;
        }

        .delete-btn {
            border: none;
            background: #fee2e2;
            color: #dc2626;
            padding: 9px 14px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
        }

        .delete-btn:hover {
            background: #fecaca;
        }

        .empty {
            text-align: center;
            padding: 25px;
            color: #6b7280;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-weight: bold;
            font-size: 14px;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            font-size: 14px;
        }

        input:focus {
            outline: none;
            border-color: #2563eb;
        }

        .save-btn {
            width: 100%;
            padding: 13px;
            border: none;
            border-radius: 8px;
            background: #2563eb;
            color: white;
            font-weight: bold;
            font-size: 15px;
            cursor: pointer;
        }

        .save-btn:hover {
            background: #1d4ed8;
        }

        .message {
            display: none;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 15px;
            text-align: center;
        }

        .success {
            background: #dcfce7;
            color: #15803d;
        }

        .error {
            background: #fee2e2;
            color: #dc2626;
        }

        @media (max-width: 600px) {

            .container {
                margin: 20px auto;
            }

            .card {
                padding: 20px;
            }

            .account {
                flex-direction: column;
                align-items: flex-start;
                gap: 12px;
            }

        }

    </style>

</head>


<body>

<div class="container">


    <!-- HEADER -->

    <div class="header">

        <div class="brand">

            <div class="brand-icon">
                S
            </div>

            <div>

                <h1>SellerShield</h1>

                <p>Payment Account Management</p>

            </div>

        </div>


        <button
            class="back-btn"
            onclick="goBack()">

            ← Dashboard

        </button>

    </div>



    <!-- ACCOUNTS -->

    <div class="card">

        <h2>Your Payment Accounts</h2>

        <p class="subtitle">

            Add the UPI accounts you want to use for customer payments.

        </p>


        <div id="message"
             class="message">
        </div>


        <div id="accountsList">

            Loading...

        </div>

    </div>



    <!-- ADD ACCOUNT -->

    <div class="card">

        <h2>Add Payment Account</h2>

        <p class="subtitle">

            Enter the name associated with the UPI account and the UPI ID.

        </p>


        <form id="accountForm">


            <div class="form-group">

                <label for="accountName">
                    Account Name
                </label>

                <input
                    type="text"
                    id="accountName"
                    placeholder="Example: Kregeash Fashions"
                    required>

            </div>


            <div class="form-group">

                <label for="upiId">
                    UPI ID
                </label>

                <input
                    type="text"
                    id="upiId"
                    placeholder="Example: name@upi"
                    required>

            </div>


            <button
                type="submit"
                class="save-btn">

                + Add Payment Account

            </button>


        </form>

    </div>


</div>


<script>


    function loadAccounts() {

        fetch("/payment-accounts")

            .then(response => {

                if (!response.ok) {
                    throw new Error(
                        "Unable to load payment accounts"
                    );
                }

                return response.json();

            })

            .then(accounts => {

                const list =
                    document.getElementById("accountsList");

                list.innerHTML = "";


                if (accounts.length === 0) {

                    list.innerHTML =
                        `<div class="empty">
                            No payment accounts added yet.
                         </div>`;

                    return;
                }


                accounts.forEach(account => {

                    const div =
                        document.createElement("div");

                    div.className = "account";


                    div.innerHTML = `

                        <div>

                            <div class="account-name">
                                ${account.accountName}
                            </div>

                            <div class="upi">
                                ${account.upiId}
                            </div>

                        </div>

                        <button
                            class="delete-btn"
                            onclick="deleteAccount(${account.id})">

                            Delete

                        </button>

                    `;


                    list.appendChild(div);

                });

            })

            .catch(error => {

                console.error(error);

                showMessage(
                    "Unable to load payment accounts",
                    "error"
                );

            });

    }



    document
        .getElementById("accountForm")
        .addEventListener("submit", function(event) {

            event.preventDefault();


            const account = {

                accountName:
                    document
                        .getElementById("accountName")
                        .value
                        .trim(),

                upiId:
                    document
                        .getElementById("upiId")
                        .value
                        .trim()

            };


            fetch("/payment-accounts", {

                method: "POST",

                headers: {
                    "Content-Type": "application/json"
                },

                body: JSON.stringify(account)

            })


            .then(response => {

                if (!response.ok) {

                    throw new Error(
                        "Unable to add payment account"
                    );

                }

                return response.json();

            })


            .then(() => {

                document
                    .getElementById("accountForm")
                    .reset();


                showMessage(
                    "Payment account added successfully!",
                    "success"
                );


                loadAccounts();

            })


            .catch(error => {

                console.error(error);

                showMessage(
                    error.message,
                    "error"
                );

            });

        });



    function deleteAccount(id) {

        if (!confirm(
            "Are you sure you want to delete this payment account?"
        )) {

            return;

        }


        fetch("/payment-accounts/" + id, {

            method: "DELETE"

        })


        .then(response => {

            if (!response.ok) {

                throw new Error(
                    "Unable to delete payment account"
                );

            }

            showMessage(
                "Payment account deleted successfully!",
                "success"
            );


            loadAccounts();

        })


        .catch(error => {

            console.error(error);

            showMessage(
                error.message,
                "error"
            );

        });

    }



    function showMessage(text, type) {

        const message =
            document.getElementById("message");

        message.textContent = text;

        message.className =
            "message " + type;

        message.style.display = "block";


        setTimeout(function() {

            message.style.display = "none";

        }, 3000);

    }



    function goBack() {

        window.location.href =
            "/dashboard.html";

    }


    loadAccounts();

</script>


</body>

</html>
